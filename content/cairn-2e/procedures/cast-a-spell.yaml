keyRules:
- Anyone can cast a spell; no class or spell slot is required. A spellbook occupies one inventory
  slot and contains one spell.
- Spellbooks cannot be easily copied or created; recover them in play. Each may have an unusual
  property or limitation.
- A failed casting save establishes ill effects; do not automatically erase the spell’s effect
  unless that is the agreed consequence.
- Check the Inventory reference after Fatigue or item changes; a full inventory reduces HP to 0.
