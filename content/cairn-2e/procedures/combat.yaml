  type: step
  label: Apply all of this side’s action results simultaneously. For multiple attacks against
    one target, use only the single highest damage die result already rolled, not separate hits.
- id: n8
  type: procedure
  label: Determine this side’s attack results together, grouped by target; hold effects for
    simultaneous resolution
  target: attacking-and-damage
- id: n9
  type: procedure
  label: Determine this side’s declared spell results; hold effects for simultaneous resolution
  target: cast-a-spell
- id: n10
  type: step
  label: Determine results for all other declared actions. Call for saves only where risky;
    hold movement and other effects until all of this side’s results are ready.
- id: n17
  type: decision
  label: Did this side declare any attacks?
- id: n11
  type: decision
  label: Has an enemy morale threshold just been reached?
- id: n12
  type: step
  label: The opponents are now the acting side.
- id: n13
  type: procedure
  label: Enemy WIL saves at newly reached thresholds — first casualty, half their number lost,
    or a lone foe reduced to 0 HP
  target: save
- id: n18
  type: step
  label: Enemies that fail morale flee; those that pass remain. Resolve these checks before
    passing play to the next side.
- id: n14
  type: decision
  label: Has the fight ended through defeat, flight or agreement?
- id: n19
  type: decision
  label: Was this the PCs’ side of the round?
- id: n15
  type: end
  label: Return to the fiction and apply any recovery or consequences
