keyRules:
- A round is roughly ten seconds. Each side acts together, with the effects of its actions simultaneous.
- After the first round, PCs act before opponents. A PC’s failed first-round DEX save does not
  lose later turns.
- An action can be an attack, spell, second move, or another reasonable activity.
- Attacks hit automatically. Multiple attacks against one target use only the highest damage die
  result; do not total them.
- Morale affects enemies, not PCs; a group may use its leader’s WIL. Running from a dire situation
  requires a safe destination and a successful DEX save.
