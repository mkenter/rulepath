id: save
title: Saves
summary: Avoid a negative outcome from a risky choice, oppose someone, or share risk.
source:
  section: Saves
  overrides:
    publication:
      title: Cairn Second Edition — Player’s Guide
      edition: Second Edition, official online text (reviewed 27 October 2026)
      url: https://cairnrpg.com/second-edition/players-guide/core-rules/
      creator: Yochai Gal and contributors
      publisher: Cairn Press
nodes:
- id: n1
  type: start
  label: Avoid a negative outcome from a risky choice, oppose someone, or share risk.
- id: n2
  type: step
  label: Explain the intent, circumstances and possible consequences. Consider preparation, tools,
    background and time.
- id: n3
  type: decision
  label: Does a risky uncertainty remain?
- id: n4
  type: step
  label: Continue after resolving the choice
- id: n5
  type: step
  label: Resolve the action from the fiction. Do not roll for a safe or assured action; explain
    alternatives if it is impossible.
- id: n6
  type: step
  label: Choose STR, DEX or WIL. For opposition or joint action, only the character most at risk
    saves (often the lowest relevant attribute).
- id: n7
  type: step
  label: Roll d20 against the current attribute. 1 always succeeds; 20 always fails.
- id: n8
  type: decision
  label: Is the roll 1, or equal to/below the attribute without being 20?
- id: n9
  type: step
  label: Continue after resolving the choice
- id: n10
  type: step
  label: Succeed; avoid the stated negative outcome.
- id: n11
  type: step
  label: Fail; apply the consequences established for this risk.
- id: n12
  type: end
  label: Return to the current situation with the consequences recorded
