keyRules:
- 'STR: physical power, endurance, poison. DEX: speed, poise, climbing, stealth, dodging. WIL:
  influence, resolve, magic.'
- A save is not a routine attack roll or perception check. Tell players about lethal risk before
  they commit.
- 'The calling rule supplies the result: a casting save, critical damage save or morale save has
  its own consequences.'
