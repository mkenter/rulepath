keyRules:
- Only one downtime action at a time. Unsafe conditions, recovery, or an action that jeopardizes
  safety prevent downtime.
- The Warden may create other downtime activities appropriate to play.
- A milestone is a comprehensive, non-interactive task. Its costs can be gold, resources, reputation
  or a unique loss. If costs cannot be met, find another way.
- The Warden may add or discard milestones as the fiction changes. There is no universal XP level,
  project price or automatic numerical reward.
