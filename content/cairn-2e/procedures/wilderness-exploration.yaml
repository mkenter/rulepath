id: wilderness-exploration
title: Wilderness Exploration
summary: Choose actions for a watch, resolve their results and events, then record resources and
  conditions.
source:
  section: Wilderness Exploration
  overrides:
    publication:
      title: Cairn Second Edition — Player’s Guide
      edition: Second Edition, official online text (reviewed 27 October 2026)
      url: https://cairnrpg.com/second-edition/players-guide/procedures/
      creator: Yochai Gal and contributors
      publisher: Cairn Press
nodes:
- id: n1
  type: start
  label: Begin a wilderness watch
- id: n2
  type: decision
  label: Does this day need a weather roll?
- id: n3
  type: step
  label: Roll d6 for the season’s weather. A second consecutive Extreme becomes Catastrophic.
    Apply the Weather table to travel and Fatigue.
- id: n4
  type: step
  label: Describe the current point or region, route, terrain and party condition. Explain their
    effect on travel time; plot or adjust the course.
- id: n5
  type: decision
  label: Each character chooses one action for this watch
- id: n6
  type: step
  label: 'Travel: combine distance, path, terrain and weather costs in watches. Reveal obvious
    nearby locations, features and terrain.'
- id: n7
  type: decision
  label: Does the Travel getting-lost check indicate you are lost?
- id: n8
  type: step
  label: You may need another Wilderness Action to recover the way. Establish the situation from
    the fiction.
- id: n9
  type: step
  label: Advance along the route; reach the next point when the required travel time is complete.
- id: n10
  type: decision
  label: Explore or Supply?
- id: n11
  type: step
  label: 'Explore: search a large area, scout ahead or tread carefully. Discover a location or
    feature. Travel is still required to leave the area.'
- id: n12
  type: step
  label: 'Supply: hunt, fish or forage for d4 Rations, each with 3 uses. Extra participants increase
    the die one step, up to d12; relevant experience or gear may also improve yield.'
- id: n13
  type: step
  label: 'Make Camp: each character and mount consumes a Ration use. Set a lookout rotation and
    sleep. Small parties may need to risk sleeping unguarded or alternate sleep.'
- id: n14
  type: decision
  label: Was this night travel?
- id: n15
  type: step
  label: Roll twice on Wilderness Events and resolve both results.
- id: n16
  type: step
  label: Roll once on Wilderness Events and resolve the result.
- id: n17
  type: decision
  label: Did you Make Camp and get adequate rest without deprivation?
- id: n18
  type: step
  label: Remove all Fatigue for characters who rested. HP recovery follows its normal requirements.
- id: n19
  type: step
  label: Record travel progress, Ration uses, Fatigue, inventory and new conditions. A full inventory
    reduces HP to 0.
- id: n20
  type: decision
  label: Continue with another watch?
- id: n21
  type: end
  label: Pause with location, time and resources recorded
