keyRules:
- The source defines morning, afternoon and night watches, each eight hours. Each character chooses
  one wilderness action per watch; split groups are independent.
- 'Travel: roads have no getting-lost check; trails 2-in-6; wilderness 3-in-6. Roll d6 where needed
  and adjust for maps, guides, skills and conditions.'
- 'Travel time: short 1, medium 2, long 3 watches; roads +0, trails +1, wilderness +2. Add terrain
  and weather costs from the references.'
- A group typically travels for two watches and camps in the third. If Make Camp is skipped, each
  PC adds one Fatigue and is deprived. Travel while sleep-deprived increases terrain difficulty
  by one step.
- 'Supply die steps: d4, d6, d8, d10, d12. Each additional participant improves one step, to a
  maximum d12.'
- Interruptions beyond minor disruption can cancel sleep benefits. Resolve events before granting
  recovery they prevent.
- For close forest trails and small clusters of points, the source defines a forestcrawl using
  dungeon cycles with Wilderness Events.
