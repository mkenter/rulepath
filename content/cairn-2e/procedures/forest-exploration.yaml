nodes:
- id: n1
  type: start
  label: Explore a small forest of close points linked by trails.
- id: n2
  type: step
  label: Use dungeon-style exploration cycles at this close scale. Substitute Wilderness Events
    for Dungeon Events.
- id: n3
  type: decision
  label: Stay on a clear trail or go off-trail?
- id: n4
  type: step
  label: Continue after resolving the choice
- id: n5
  type: step
  label: Use the known route and its fictional travel time.
- id: n6
  type: step
  label: Explain added time, effort, tools and obvious danger before committing. Going off-trail
    triggers a Wilderness Events roll.
- id: n7
  type: procedure
  label: Continue Dungeon Exploration with the forestcrawl event substitution
  target: dungeon-exploration
- id: n8
  type: end
  label: Return to the current situation with the consequences recorded
