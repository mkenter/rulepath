keyRules:
- Attacks hit automatically; do not roll to hit. Declare all actions before resolving the side’s
  results.
- Blast affects all targets in an area, rolling separately for each. If how many are affected
  is unclear, roll the damage die to determine the number.
- Ranged weapons work within clear nearby sight; especially distant targets are impaired. Ordinary
  ammunition is not tracked.
- Individual attacks against detachments are impaired except blast. Detachments’ attacks against
  individuals are enhanced and blast.
- Only positive HP loss taking a PC to exactly 0 triggers a scar. Use actual HP lost in that attack,
  not damage before armor.
- HP represents protection from harm. Warden examples sometimes bypass HP for an unaware or defenseless
  target; this is a contextual fictional ruling.
- 'Outside-combat damage generally goes directly to an attribute, usually STR; follow the effect’s
  specific rules. At 0 STR: death; 0 DEX: paralysis; 0 WIL: delirium.'
