  label: Resolve a declared attack
- id: n2
  type: decision
  label: What damage dice apply?
- id: n3
  type: step
  label: Roll the applicable damage dice. For two weapons or multiple attacks on one target, keep
    only the single highest result.
- id: n4
  type: step
  label: 'Impaired position or unarmed attack: use d4.'
- id: n5
  type: step
  label: 'Enhanced position: use d12.'
- id: n6
  type: step
  label: Use the weapon’s normal damage die.
- id: n7
  type: step
  label: For blast, resolve every affected target separately. Subtract that target’s armor (maximum
    3); damage cannot be negative.
- id: n8
  type: decision
  label: Is there any damage after armor?
- id: n9
  type: end
  label: No damage; do not generate a scar
- id: n10
  type: decision
  label: Can the target use HP to avoid this attack’s harm?
- id: n11
  type: decision
  label: Compare damage with remaining HP
- id: n12
  type: end
  label: Reduce HP by damage. The target remains in the fight.
- id: n13
  type: decision
  label: The attack takes HP exactly to 0. Is the target a PC?
- id: n14
  type: end
  label: Apply the Scars entry equal to HP lost in this attack; record its effects and recovery
    requirements.
- id: n15
  type: end
  label: No PC scar. A lone foe at 0 HP must check morale.
- id: n16
  type: step
  label: Set HP to 0; subtract only the excess from STR.
- id: n17
  type: step
  label: The Warden’s fictional ruling bypasses HP; apply the attack’s damage to STR.
- id: n18
  type: decision
  label: Is remaining STR 0?
- id: n19
  type: end
  label: At 0 STR the target dies; a detachment is destroyed.
- id: n20
  type: procedure
  label: Make a STR Save using the reduced score
  target: save
- id: n21
  type: decision
  label: Did the STR save succeed?
- id: n22
  type: end
  label: Remain in the fight with reduced STR. Further STR damage requires another critical damage
    save.
- id: n23
  type: step
  label: Take critical damage. Apply any special critical-damage effect of the attack.
- id: n24
  type: decision
  label: Who suffered critical damage?
- id: n25
  type: end
  label: 'PC: only crawl weakly. Aid such as bandages stabilizes; without treatment, die within
    an hour.'
- id: n26
  type: end
  label: 'NPC or monster: the Warden may consider them dead.'
- id: n27
  type: end
  label: 'Detachment: routed or significantly weakened.'
