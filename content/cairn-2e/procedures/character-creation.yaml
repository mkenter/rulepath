keyRules:
- A background provides equipment, knowledge and fictional permissions; it does not restrict a
  character to a class.
- Bonds may grant items or abilities; record those too. Character advancement follows experiences
  and downtime rather than XP levels.
- Use the official character-creation and background tables for names, items, traits, bonds and
  omens. Those catalogs are outside this procedure navigator.
