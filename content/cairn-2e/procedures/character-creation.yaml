id: character-creation
title: Character Creation
summary: Create a new Cairn Second Edition character.
source:
  section: Character Creation
  overrides:
    publication:
      title: Cairn Second Edition — Player’s Guide
      edition: Second Edition, official online text (reviewed 27 October 2026)
