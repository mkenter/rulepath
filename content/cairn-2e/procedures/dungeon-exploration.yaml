keyRules:
- A turn allows movement about 40ft (torchlight’s perimeter) and one action. An action may instead
  move up to three times that distance, increasing risk.
- Roll events after more than one cycle in a single location, quick/haphazard movement, entering
  a new area/level/zone, or a loud disturbance.
- Dungeon turns measure the cost of actions; the source does not assign a universal fixed number
  of minutes.
- In a forestcrawl, substitute Wilderness Events. Going off-trail also triggers an event.
- Provide obvious sensory information freely. Searching spends time to expose hidden details,
  rather than rolling perception.
