id: conditions
title: Deprivation and Fatigue
summary: Deprivation blocks recovery. Each Fatigue fills one inventory slot.
source:
  section: Core Rules / Deprivation & Fatigue; Procedures / Panic
  overrides:
    publication:
      title: Cairn Second Edition — Player’s Guide
      edition: Second Edition, official online text (reviewed 27 October 2026)
      url: https://cairnrpg.com/second-edition/players-guide/
      creator: Yochai Gal and contributors
      publisher: Cairn Press
sections:
- heading: Deprivation & Fatigue
  bullets:
  - A PC that lacks a crucial need (such as food or rest) is Deprived. Anyone Deprived for more
    than a day adds Fatigue to their inventory, one for each day. A Deprived PC cannot recover
    HP, Attributes, or item slots from Fatigue.
  - A PC may also be forced to add Fatigue after casting spells or due to events occurring in
    the fiction. Each Fatigue occupies one slot and lasts until the PC is able to recuperate (such
    as with a full night’s rest in a safe spot).
  - If a character is forced to add Fatigue to their inventory but they have no free slots, they
    must drop an item from their inventory.
- heading: Panic
  bullets:
  - A character that is surrounded by enemies, enveloped by darkness, or facing their greatest
    fears may experience panic. A WIL save is typically required to avoid losing control and becoming
    panicked.
  - A panicked character must make a WIL save to overcome their condition as an action on their
    turn.
  - A panicked character has 0 HP, does not act in the first round of combat, and all of their
    attacks are impaired.
