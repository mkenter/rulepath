id: magic
title: Magic, Spellbooks, Scrolls and Relics
summary: Anyone can read a held spellbook aloud. Books cause Fatigue; scrolls and relics have
  different costs.
source:
  section: Magic, Spellbooks, Scrolls and Relics
  overrides:
    publication:
      title: Cairn Second Edition — Player’s Guide
      edition: Second Edition, official online text (reviewed 27 October 2026)
      url: https://cairnrpg.com/second-edition/players-guide/core-rules/
      creator: Yochai Gal and contributors
      publisher: Cairn Press
sections:
- heading: Spellbooks
  bullets:
  - Spellbooks contain a single spell and take up one slot. They cannot be easily transcribed
    or created; instead they are recovered from places like tombs, dungeons, and manors.
  - Spellbooks sometimes display unusual properties or limitations, such as producing a foul or
    unearthly smell when opened, possessing an innate intelligence, or being legible only when
    held in moonlight.
  - Spellbooks will attract the attention of those who seek the arcane power within, and it is
    considered dangerous to display them openly.
- heading: Casting Spells
  bullets:
  - Anyone can cast a spell by holding a Spellbook in both hands and reading its contents aloud.
    They must then add a Fatigue to inventory.
  - Given time and safety, PCs can enhance a spell’s impact (e.g., affecting multiple targets,
    increasing its power, etc.) without any additional cost.
  - If the PC is deprived or in danger (such as during combat), the Warden may require a PC to
    make a WIL save to avoid any ill-effects from casting the spell. Consequences of failure are
    on par with the intended effect and may result in added Fatigue, the destruction of the Spellbook,
    injury, and even death.
- heading: Scrolls
  paragraphs:
  - 'Scrolls are similar to Spellbooks, however:'
  bullets:
  - They are petty.
  - They do not cause Fatigue.
  - They disappear after one use.
- heading: Relics
  paragraphs:
  - Relics are items imbued with a magical spell or power. They do not cause Fatigue. Relics usually
    have limited use, as well as a Recharge condition.
