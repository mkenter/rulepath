id: wilderness-events
title: Wilderness Events
summary: Roll d6 after wilderness actions. Night travel requires two event rolls.
source:
  section: Wilderness Events
  overrides:
    publication:
      title: Cairn Second Edition — Player’s Guide
      edition: Second Edition, official online text (reviewed 27 October 2026)
      url: https://cairnrpg.com/second-edition/players-guide/procedures/
      creator: Yochai Gal and contributors
      publisher: Cairn Press
sections:
- heading: Wilderness Events
  table:
    columns:
    - d6
    - Event
    - Description
    rows:
    - - '1'
      - Encounter
      - Roll on an encounter table for that terrain type or location. Don’t forget to roll for
        NPC reactions if applicable.
    - - '2'
      - Sign
      - The party discovers a clue, spoor, or indication of a nearby encounter, locality, hidden
        feature, or information about a nearby area.
    - - '3'
      - Environment
      - A shift in weather or terrain.
    - - '4'
      - Loss
      - The party is faced with a choice that costs them a resource (rations, tools, etc), time,
        or effort.
    - - '5'
      - Exhaustion
      - The party encounters a barrier, forcing effort, care or delays. This might mean spending
        extra time (and an additional Wilderness Action) or adding Fatigue to the PC’s inventory
        to represent their difficulties.
    - - '6'
      - Discovery
      - The party finds food, treasure, or other useful resources. The Warden can instead choose
        to reveal the primary feature of the area.
