id: combat-rules
title: Combat Rules
summary: Side initiative, simultaneous declarations, automatic hits, armor, critical damage and
  retreat.
source:
  section: Combat Rules
  overrides:
    publication:
      title: Cairn Second Edition — Player’s Guide
      edition: Second Edition, official online text (reviewed 27 October 2026)
      url: https://cairnrpg.com/second-edition/players-guide/core-rules/
      creator: Yochai Gal and contributors
      publisher: Cairn Press
sections:
- heading: Rounds
  bullets:
  - A Round is roughly ten seconds of in-game time and proceeds with each side taking turns. Each
    round starts with any PC that is able to act, followed by their opponents. The result of each
    side’s actions occur simultaneously.
  - During the first round of combat, each PC must make a DEX save in order to act. Special circumstances,
    abilities, items, or skills may negate this requirement. PCs that fail their save lose their
    turn for this round.
  - Their opponents then take their turn, and the first round ends. The next round begins with
    the PCs taking their turn, followed by their opponents, and so on until combat has ended with
    one side defeated or fled.
- heading: Actions
  paragraphs:
  - On their turn, a character may move up to 40ft and take up to one action. This may be casting
    a spell, attacking, moving for a second time, or some other reasonable action. Each round,
    the PCs declare what they are doing before dice are rolled. If a character attempts something
    risky, the Warden calls for a save for appropriate players or NPCs.
- heading: Attacking & Damage
  bullets:
  - The attacker rolls their weapon die and subtracts the target’s armor, then deals the remaining
    total to their opponent’s HP. Attacks in combat automatically hit.
  - If multiple attackers target the same foe, roll all damage dice and keep the single highest
    result. All actions are declared before being resolved.
  - If an attack would take a PC’s HP exactly to 0, refer to the Scars table to see how they are
    uniquely impacted.
- heading: Attack Modifiers
  bullets:
  - If fighting from a position of weakness (such as through cover or with bound hands), the attack
    is Impaired, and the attacker must roll 1d4 damage regardless of the attacks damage die. Unarmed
    attacks always do d4 damage.
  - If fighting from a position of advantage (such as against a helpless foe or through a daring
    maneuver), the attack is Enhanced, allowing the attacker to roll 1d12 damage instead of their
    normal die.
  - Attacks with the Blast quality affect all targets in the noted area, rolling separately for
    each affected character. This can be anything from explosions to a dragon’s breath or the
    impact of a meteorite. If unsure how many targets can be affected, roll the related damage
    die for a result.
  - If attacking with two weapons at the same time, roll both damage dice and keep the single
    highest result (denoted with a plus symbol, e.g. d8+d8).
- heading: Critical Damage
  bullets:
  - Damage that reduces a target’s HP below zero is subtracted from their STR by the amount of
    damage remaining. The target must then immediately make a STR save to avoid taking Critical
    Damage, using their new STR score. On a success, the target is still in the fight (albeit
    with a lower STR score) and must continue to make critical damage saves when incurring damage.
  - Any PC that suffers Critical Damage cannot do anything but crawl weakly, grasping for life.
    If given aid (such as bandages), they will stabilize. If left untreated, they die within the
    hour. NPCs and monsters that fail a Critical Damage save are considered dead, per the Warden’s
    discretion. Additionally, some enemies will have special abilities or effects that are triggered
    when their target fails a critical damage save.
- heading: Attribute Loss
  bullets:
  - If a PC takes damage outside of combat, they should instead receive damage to an Attribute,
    typically STR.
  - If a PC’s STR is reduced to 0, they die. If their DEX is reduced to 0, they are paralyzed.
    If their WIL is reduced to 0, they are delirious. Complete DEX and WIL loss renders the character
    unable to act until they are restored through extended rest or by extraordinary means.
- heading: Character Death
  bullets:
  - When a character dies, the player should create a new character or take control of a hireling.
    They immediately join the party in order to reduce downtime.
- heading: Detachments
  bullets:
  - Large groups of similar combatants fighting together are treated as a single Detachment. When
    a detachment takes Critical Damage, it is routed or significantly weakened. When it reaches
    0 STR, it is destroyed.
  - Attacks against detachments by individuals are impaired (excluding blast damage). Attacks
    against individuals by detachments are enhanced and deal blast damage.
- heading: Retreat
  bullets:
  - Running away from a dire situation always requires a successful DEX save, as well as a safe
    destination to run to.
- heading: Ranged Attacks
  bullets:
  - Ranged weapons can target any enemy near enough to see the whites of their eyes. Attacks against
    especially distant targets are Impaired.
  - Ammunition is not tracked unless otherwise specified.
