id: inventory
title: Inventory and Encumbrance
summary: Ten slots maximum; filling all ten reduces HP to 0. Petty items use no slots, bulky items
  use two.
source:
  section: Inventory and Encumbrance
  overrides:
    publication:
      title: Cairn Second Edition — Player’s Guide
      edition: Second Edition, official online text (reviewed 27 October 2026)
      url: https://cairnrpg.com/second-edition/players-guide/character-creation/
      creator: Yochai Gal and contributors
      publisher: Cairn Press
sections:
- heading: Inventory
  bullets:
  - Characters have a total of ten inventory slots but can only carry four or five items comfortably
    without the help of bags, backpacks, horses, carts, etc.
  - Each PC starts with a Backpack that can hold up to six slots of items or Fatigue. Carts (which
    must be pulled with both hands), horses, or mules can make a huge difference in how much a
    PC can bring with them on an adventure. Hirelings can also be paid to carry equipment.
  - Inventory is abstract, dependent only on the fiction as adjudicated by the Warden. Anyone
    carrying a full inventory (i.e. filling all 10 slots) is reduced to 0 HP. A character cannot
    fill more than ten slots.
- heading: Inventory Slots
  bullets:
  - Most items take up one slot unless otherwise indicated.
  - Petty items do not take up any slots. Bulky items take up two slots.
  - A bag of coins worth less than 100gp is petty and does not occupy a slot.
