id: momentum
title: Momentum
summary: Momentum ranges from -6 to your current maximum. Burn positive momentum after an action
  roll to cancel lower challenge dice, then reset. Negative momentum can cancel the action die.
source:
  section: Momentum
related:
- procedure: action-roll
- procedure: face-a-setback
- reference: debilities
sections:
- heading: Limits and reset
  paragraphs:
  - Momentum begins at +2, normally ranges from -6 to +10, and resets to +2 after burning. Maximum
    is 10 minus the number of marked debilities. One debility changes reset to +1; two or more
    change reset to 0.
- heading: Negative momentum
  paragraphs:
  - When the action die equals the magnitude of negative momentum, cancel the action die; use
    only stat/track and adds. At -6, further loss triggers Face a Setback.
- heading: Burning
  paragraphs:
  - After an action roll, optionally burn positive momentum to cancel challenge dice strictly
    below it. Reset after burning. Momentum cannot be burned on a progress roll.
