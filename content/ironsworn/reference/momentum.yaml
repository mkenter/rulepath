id: momentum
title: Momentum
summary: "Momentum ranges from -6 to a maximum starting at +10, reduced by 1 per
  marked debility. Positive momentum may be burned after an action roll: cancel
  challenge dice strictly below your momentum; one canceled die guarantees at
  least a weak hit and two a strong hit. Keep any success against the other die.
  Burning is optional. Reset afterward to +2 with no debilities, +1 with one, or
  0 with more than one. At negative momentum, cancel the action die if its value
  equals the magnitude of that negative momentum; still compare stat plus adds.
  Never apply momentum to progress rolls. At minimum momentum, further loss
  requires Face a Setback (outside this sample; consult the SRD). You cannot
  gain momentum above your current maximum."
source:
