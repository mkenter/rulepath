id: price-table
title: Pay the Price Table
summary: Roll d100 (00 means 100). Interpret the negative consequence in the fiction; reroll if
  it does not fit.
source:
  section: Pay the Price / Roll–Result table
  overrides:
    publication:
      title: Ironsworn Playkit — Original Move Sheets
      edition: Original Ironsworn move reference; official CC BY 4.0 text edition
      url: https://tomkinpress.com/collections/free-downloads/products/ironsworn-playkit
      creator: Shawn Tomkin
      publisher: Tomkin Press
related:
- procedure: pay-the-price
- procedure: ask-the-oracle
sections:
- heading: Consequences
  table:
    columns:
    - Roll
    - Result
    rows:
    - - 1-2
      - Roll again and apply that result but make it worse. If you roll this result yet again,
        think of something dreadful that changes the course of your quest (Ask the Oracle if unsure)
        and make it happen.
    - - 3-5
      - A person or community you trusted loses faith in you, or acts against you.
    - - 6-9
      - A person or community you care about is exposed to danger.
    - - 10-16
      - You are separated from something or someone.
    - - 17-23
      - Your action has an unintended effect.
    - - 24-32
      - Something of value is lost or destroyed.
    - - 33-41
      - The current situation worsens.
    - - 42-50
      - A new danger or foe is revealed.
    - - 51-59
      - It causes a delay or puts you at a disadvantage.
    - - 60-68
      - It is harmful.
    - - 69-76
      - It is stressful.
    - - 77-85
      - A surprising development complicates your quest.
    - - 86-90
      - It wastes resources.
    - - 91-94
      - It forces you to act against your best intentions.
    - - 95-98
      - A friend, companion, or ally is put in harm’s way (or you are, if alone).
    - - 99-00
      - Roll twice more on this table. Both results occur. If they are the same result, make it
        worse.
- heading: Source variation
  paragraphs:
  - The official original move sheet uses 69–76 for stress and 77–85 for a complication. SRD .09
    instead splits these at 77/78; this table follows the original move sheet.
