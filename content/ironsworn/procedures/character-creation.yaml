id: character-creation
title: Character Creation
summary: Create a hero for solo, co-op or guided Ironsworn.
source:
  section: Character Creation
nodes:
- id: n1
  type: start
  label: Create a hero for solo, co-op or guided Ironsworn.
- id: n2
  type: step
  label: Envision your character, choose a name, and assign 3, 2, 2, 1, 1 among edge, heart, iron,
    shadow and wits.
- id: n3
  type: step
  label: Set health, spirit and supply to +5; momentum to +2; maximum momentum +10 and reset +2.
    Clear debilities.
- id: n4
  type: step
  label: Choose three assets and mark each preset ability, or choose one ability if none is preset.
    Meet any requirements.
- id: n5
  type: step
  label: Envision up to three background bonds. Mark one tick for each and note the people or
    communities.
- id: n6
  type: step
  label: Write an epic background vow. Envision an inciting incident and swear a vow to address
    it.
- id: n7
  type: procedure
  label: Swear an Iron Vow for the inciting incident
  target: swear-an-iron-vow
- id: n8
  type: step
  label: Record important equipment, bonds and vows. Begin in the fiction.
- id: n9
  type: end
  label: Apply the outcome and continue the fiction
