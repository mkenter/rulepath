keyRules:
- Roll +edge for speed, agility or precision; +heart for charm, loyalty or courage; +iron for
  aggression, force, strength or endurance; +shadow for deception or stealth; +wits for expertise,
  insight or observation.
- In combat, this can defend without inflicting harm; a strong hit gains initiative.
