id: face-danger
title: Face Danger
summary: Attempt something risky or react to an imminent threat.
source:
  section: Face Danger
nodes:
- id: n1
  type: start
  label: Attempt something risky or react to an imminent threat.
- id: n2
  type: procedure
  label: Action Roll (stat matching your approach)
  target: action-roll
- id: n3
  type: decision
  label: What is the roll result?
- id: n4
  type: end
  label: Apply the outcome and continue the fiction
- id: n5
  type: step
  label: Succeed and take +1 momentum.
- id: n6
  type: step
  label: Succeed, but face a troublesome cost.
- id: n7
  type: decision
  label: Choose a cost to resources or personal endurance
- id: n8
  type: step
  label: Continue after resolving the choice
- id: n9
  type: step
  label: Suffer -1 momentum.
- id: n10
  type: procedure
  label: Endure Harm (1 harm)
  target: endure-harm
- id: n11
  type: procedure
  label: Endure Stress (1 stress)
  target: endure-stress
- id: n12
  type: step
  label: Suffer -1 supply; if it reaches 0, make Out of Supply.
- id: n13
  type: step
  label: Fail, or have progress undermined by a costly turn.
- id: n14
  type: procedure
  label: Pay The Price
  target: pay-the-price
- id: resource-cost
  type: decision
  label: Choose a resource cost
- id: personal-cost
  type: decision
  label: Choose a personal cost
