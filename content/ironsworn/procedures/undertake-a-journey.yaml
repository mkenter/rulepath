keyRules:
- Set the journey’s rank and a ten-box track when you begin. Roll once per segment. A waypoint
  is not a fixed distance or day.
- If setting off from a bonded community, add +1 to the initial roll only.
- Allies share journey progress and supply; only the acting character gains momentum. Others may
  Aid Your Ally.
- Safe mundane travel needs no move. If merely a passenger, resolve travel in the fiction.
