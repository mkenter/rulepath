keyRules:
- 'Charm, pacify, barter or convince: +heart (add +1 if bonded). Threaten or incite: +iron. Lie
  or swindle: +shadow.'
- You need credible leverage. Guaranteed agreement or an impossible request needs no roll.
- A weak hit grants the strong-hit benefits if the exchange is completed.
