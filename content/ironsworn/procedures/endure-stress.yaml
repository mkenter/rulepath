  label: Choose one
- id: n7
  type: step
  label: Continue after resolving the choice
- id: n8
  type: step
  label: 'Only if spirit is above 0: suffer -1 momentum and take +1 spirit.'
- id: n9
  type: step
  label: Take +1 momentum.
- id: n10
  type: step
  label: Press on.
- id: n11
  type: step
  label: Suffer -1 momentum.
- id: n12
  type: decision
  label: Is spirit at 0?
- id: n13
  type: step
  label: Continue after resolving the choice
- id: n14
  type: step
  label: Continue, battered but unbroken.
- id: n15
  type: decision
  label: Mark an unmarked debility, or roll the consequence table
- id: n16
  type: step
  label: Continue after resolving the choice
- id: n17
  type: step
  label: If not already marked, mark shaken.
- id: n18
  type: step
  label: If not already marked, mark corrupted.
- id: n19
  type: step
  label: Roll d100 on the linked consequence table and resolve its result.
