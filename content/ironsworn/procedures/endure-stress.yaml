id: endure-stress
title: Endure Stress
summary: Face mental shock or despair.
source:
  section: Endure Stress
nodes:
- id: n1
  type: start
  label: Face mental shock or despair.
- id: n2
  type: step
  label: Reduce spirit by the harm or stress. At 0, convert any excess to -momentum.
- id: n3
  type: procedure
  label: Action Roll (spirit or heart, whichever is higher)
  target: action-roll
- id: n4
  type: decision
  label: What is the roll result?
- id: n5
  type: end
  label: Apply the outcome and continue the fiction
- id: n6
