keyRules:
- Suffer -spirit equal to the foe’s rank or the fictional severity (1–5; default 2). Convert overflow
  below 0 to -momentum before rolling.
- If both relevant debilities are already marked, you must roll the consequence table.
- In combat, a strong hit on this suffer move can take initiative.
