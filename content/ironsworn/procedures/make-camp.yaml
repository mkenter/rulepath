keyRules:
- 'Recuperate: +1 health for you and companions. Partake: -1 supply, +1 health for you and companions.
  Relax: +1 spirit. Focus: +1 momentum. Prepare: add +1 when you break camp and Undertake a Journey.'
- Only one character rolls for a group; each chooses their own benefits. Each option can be selected
  only once.
- Wounded and shaken block their respective track recovery until cleared.
