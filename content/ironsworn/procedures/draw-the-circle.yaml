id: draw-the-circle
title: Draw the Circle
summary: Challenge someone to a formal duel, or accept a challenge.
source:
  section: Draw the Circle
nodes:
- id: n1
  type: start
  label: Challenge someone to a formal duel, or accept a challenge.
- id: n2
  type: procedure
  label: Action Roll (heart; add +1 if bonded to this community)
  target: action-roll
- id: n3
  type: decision
  label: What is the roll result?
- id: n4
  type: end
  label: Apply the outcome and continue the fiction
- id: n5
  type: step
  label: Take +1 momentum; optionally select up to three distinct boasts for +1 momentum each.
    You start with initiative unless granting first strike.
- id: n6
  type: step
  label: Optionally select one boast for +1 momentum. You start with initiative unless granting
    first strike.
- id: n7
  type: step
  label: Your foe has initiative; begin at a disadvantage.
- id: n8
  type: procedure
  label: Pay The Price
  target: pay-the-price
