keyRules:
- Set a foe progress track by rank, but use this move instead of Enter the Fray. Then resolve
  the fight with the normal combat moves.
- Victor may make a lawful demand. If you refuse the challenge, surrender or lose, your opponent
  makes a demand of you; refusing forfeits honor and standing.
