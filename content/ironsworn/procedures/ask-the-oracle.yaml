id: ask-the-oracle
title: Ask the Oracle
summary: Resolve uncertainty, reveal details, decide NPC responses, or inspire events using a
  conclusion, yes/no roll, two options, or a prompt.
source:
  section: Ask the Oracle
nodes:
- id: start
  type: start
  label: Seek an answer about the world, another character, or what happens next
- id: method
  type: decision
  label: How will you answer the question?
- id: conclude
  type: step
  label: Decide the most interesting and obvious answer.
- id: pick-two
  type: step
  label: Envision two options. Treat one as likely; yes selects it, no selects the other.
- id: spark
  type: step
  label: Brainstorm or roll an appropriate oracle table; interpret the prompt in context.
- id: odds
  type: step
  label: 'Choose the odds of yes: almost certain, likely, 50/50, unlikely, or small chance'
- id: roll
  type: step
  label: Roll two ten-sided oracle dice as a number from 1 to 100 (00 means 100)
- id: answer
  type: decision
  label: Is the roll at or above the threshold for your chosen odds?
- id: 'true'
  type: step
  label: 'Yes: the proposed answer is true'
- id: 'false'
  type: step
  label: 'No: the proposed answer is false'
- id: match
  type: decision
  label: Do the oracle dice match?
- id: twist
  type: step
  label: An extreme result or twist has occurred. Envision it; if stuck, move on
- id: done
  type: end
  label: Interpret the answer in the fiction and continue
- id: random-method
  type: decision
  label: Ask yes/no, or choose between two possibilities?
edges:
- from: odds
  to: roll
- from: roll
  to: answer
- from: answer
  to: 'true'
  label: 'Yes'
- from: answer
  to: 'false'
  label: 'No'
- from: 'true'
  to: match
- from: 'false'
  to: match
- from: match
