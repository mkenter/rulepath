  label: 'Yes'
- from: match
  to: done
  label: 'No'
- from: twist
  to: done
- from: start
  to: method
- from: method
  to: conclude
  label: Draw a conclusion
- from: method
  to: spark
  label: Spark an idea
- from: conclude
  to: done
- from: spark
  to: done
- from: pick-two
  to: roll
- from: method
  to: random-method
  label: Roll an answer
- from: random-method
  to: odds
  label: Yes/no question
- from: random-method
  to: pick-two
  label: Two possibilities
keyRules:
- 'Almost certain: yes on 11–100. Likely: yes on 26–100. 50/50: yes on 51–100. Unlikely: yes on
  76–100. Small chance: yes on 91–100.'
- For “pick two,” envision two options and rate one likely. On 26–100 it happens; otherwise the
  other does.
- This is an oracle roll, not an action roll. Do not add a stat or apply momentum.
- In guided play, the GM is the oracle; use this move when talking things out needs a random result
  or inspiration.
- For a prompt oracle, roll d100, consult the result, and interpret it in the fiction. If stuck,
  look one row up/down, reverse the digits, reroll, use a different table, or decide.
- Matching dice on ordinary prompt tables have no special effect unless the table says otherwise.
  Avoid endless follow-up questions; settle on an answer and continue.
