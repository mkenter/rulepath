id: swear-an-iron-vow
title: Swear an Iron Vow
summary: Swear upon iron to complete a quest.
source:
  section: Swear an Iron Vow
nodes:
- id: n1
  type: start
  label: Swear upon iron to complete a quest.
- id: n2
  type: step
  label: Write the vow and set its rank. Touch iron and envision the oath.
- id: n3
  type: procedure
  label: Action Roll (heart; add +1 if sworn to a bonded person or community)
  target: action-roll
- id: n4
  type: decision
  label: What is the roll result?
- id: n5
  type: end
  label: Apply the outcome and continue the fiction
- id: n6
  type: step
  label: Your path is clear. Envision the next step; take +2 momentum.
- id: n7
  type: step
  label: 'Determined but uncertain: take +1 momentum; envision how to find a path forward.'
- id: n8
  type: step
  label: A significant obstacle blocks the quest before it begins.
- id: n9
  type: decision
  label: Press on or give up?
- id: n10
  type: step
  label: Continue after resolving the choice
- id: n11
  type: step
  label: Suffer -2 momentum and overcome the obstacle before making quest progress.
- id: n12
  type: procedure
  label: Forsake Your Vow
  target: forsake-your-vow
