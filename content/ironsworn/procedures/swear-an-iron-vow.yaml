keyRules:
- Write the vow, set its rank and create a progress track first.
- Overcoming a miss’s initial obstacle is not a milestone for this quest.
- For a shared vow, one character speaks/rolls; allies can aid. Personal momentum changes affect
  the acting character; progress is shared.
