keyRules:
- 'Fight at range / speed / terrain: +edge; courage / allies / companions: +heart; overpower in
  close: +iron; trickery: +shadow; tactics: +wits.'
- Do not use a combat progress track or End the Fight for this resolution.
- One character rolls for allies; helpers Aid Your Ally first. Only the acting character receives
  momentum.
