id: companion-endure-harm
title: Companion Endure Harm
summary: Your companion suffers physical damage.
source:
  section: Companion Endure Harm
nodes:
- id: n1
  type: start
  label: Your companion suffers physical damage.
- id: n2
  type: step
  label: Reduce companion health by the harm; convert overflow below 0 to your -momentum.
- id: n3
  type: procedure
  label: Action Roll (heart or companion’s remaining health, whichever is higher)
  target: action-roll
- id: n4
  type: decision
  label: What is the roll result?
- id: n5
  type: end
  label: Apply the outcome and continue the fiction
- id: n6
  type: step
  label: 'Your companion rallies: give them +1 health.'
- id: n7
  type: decision
  label: Is companion health 0?
- id: n8
  type: step
  label: Continue after resolving the choice
- id: n9
  type: step
  label: They cannot assist until they gain at least +1 health.
- id: n10
  type: step
  label: They are battered but can continue.
- id: n11
  type: step
  label: Suffer -1 momentum.
- id: n12
  type: decision
  label: Is companion health 0?
- id: n13
  type: step
  label: Continue after resolving the choice
- id: n14
  type: step
  label: Your companion remains in action.
- id: n15
  type: decision
  label: Is the action die a 1?
- id: n16
  type: step
  label: Continue after resolving the choice
- id: n17
  type: step
  label: Companion dies. Take 1 experience for each marked ability; remove the asset.
- id: n18
  type: step
  label: Gravely wounded and out of action. Without aid they die in an hour or two.
