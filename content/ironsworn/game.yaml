game:
  id: ironsworn
  title: Ironsworn
  publisher: Shawn Tomkin
  summary: Follow the original game’s moves, choices and consequences, with shared roll procedures
    and supporting mechanical lookups. Unofficial; CC BY 4.0.
  source:
    publication:
      title: Ironsworn System Reference Document
      edition: Ironsworn SRD .09 (January 14, 2023)
      url: https://docs.google.com/document/d/11ypqt6GfLuBhGDJuBGWKlHa-Ru48Tf3G_6zbrYKmXgY/edit
      creator: Shawn Tomkin
      publisher: Shawn Tomkin
    licensing:
      copyright: Copyright ©2018 Shawn Tomkin.
      license:
        name: Creative Commons Attribution 4.0 International (CC BY 4.0)
        url: https://creativecommons.org/licenses/by/4.0/
      attribution: This work is based on Ironsworn (found at https://www.ironswornrpg.com), created
        by Shawn Tomkin, and licensed for our use under the Creative Commons Attribution 4.0 International
        License (https://creativecommons.org/licenses/by/4.0/).
      adaptation: SRD .09 rules and original move text have been reorganized and paraphrased into
        linked procedures and supporting references. Adapted Ironsworn content is CC BY 4.0. Asset
        cards and creative oracle catalogs are outside the procedure-focused scope. No rulebook-only
        noncommercial content, publisher artwork, icons or layouts are included. This is unofficial
        and implies no endorsement.
