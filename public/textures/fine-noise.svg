<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <filter id="cloth" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.018 0.74"
      numOctaves="2"
      seed="37"
      stitchTiles="stitch"
      result="warp"
    />
    <feTurbulence
      type="fractalNoise"
      baseFrequency="0.69 0.014"
      numOctaves="2"
      seed="83"
      stitchTiles="stitch"
      result="weft"
