name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: Validate and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks and scan Git history
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          scan_dir=$(mktemp -d)
          trap 'rm -rf "$scan_dir"' EXIT
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --retry 3 "$release_url/$archive" -o "$scan_dir/$archive"
          curl --fail --silent --show-error --location --retry 3 "$release_url/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$scan_dir/checksums.txt"
          awk -v archive="$archive" '$2 == archive { print }' "$scan_dir/checksums.txt" > "$scan_dir/selected-checksum.txt"
          test "$(wc -l < "$scan_dir/selected-checksum.txt")" -eq 1
          (cd "$scan_dir" && sha256sum --check --strict selected-checksum.txt)
          tar -xzf "$scan_dir/$archive" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git --redact=100 --log-opts="--all" .

      - name: Check diff whitespace
        run: git diff --check

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium

      - name: Validate content
        run: npm run validate:content

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Run Chromium browser tests
        id: playwright
        # Keep runner resource use predictable and retain traces on the first failure.
        run: npm run test:e2e -- --workers=2 --trace=retain-on-failure

      - name: Upload Playwright failure artifacts
        if: ${{ failure() && steps.playwright.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
